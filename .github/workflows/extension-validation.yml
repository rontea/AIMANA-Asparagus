name: Extension Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-extensions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate installed extensions
        run: npm run validate:extensions
